<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebTab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="webCanvas"></canvas>
<div class="halftone"></div>
<div class="vignette"></div>
<div class="glitch-strip" id="glitchStrip" style="top:30%"></div>

<!-- big hanging spider -->
<div class="spider-hang" id="spiderHang" title="sup">
  <div class="hang-thread"></div>
  <div class="hang-spider">🕷️</div>
</div>

<!-- tiny spider that follows your mouse -->
<div class="mouse-spider" id="mouseSpider">🕷️</div>

<div class="page">

  <div class="logo">WebTab</div>
  <div class="tagline">friendly neighborhood browser start screen</div>
  <div class="greeting" id="greeting">loading...</div>
  <div class="clock" id="clock">--:--:--</div>

  <!-- search bar -->
  <div class="search-zone">
    <div class="spider-thread">
      <div class="spider" id="spiderDangle">🕷️</div>
    </div>
    <form class="search-box" id="searchForm">
      <input type="text" id="searchInput" placeholder="search the multiverse..." autocomplete="off">
      <button type="submit">🔍</button>
    </form>
  </div>

  <!-- quick links -->
  <div class="links-row" id="linksRow">
    <a class="quick-link" href="https://github.com" target="_blank">
      <span class="icon">🐙</span> github
    </a>
    <a class="quick-link" href="https://youtube.com" target="_blank">
      <span class="icon">📺</span> youtube
    </a>
    <a class="quick-link" href="https://slack.com" target="_blank">
      <span class="icon">💬</span> slack
    </a>
  </div>

</div>

<!-- spidey sense widget -->
<div class="sense-corner" id="senseCorner">
  <div class="sense-label"><span class="dot"></span>spidey-sense</div>
  <div class="sense-text" id="senseText">tingling...</div>
  <button class="sense-refresh" id="senseRefresh">refresh ✦</button>
</div>

<!-- all the javascript stuff -->
<script type="module" src="/src/main.js"></script>
</body>
</html>
